server {
    server_name southramp.com www.southramp.com;

    access_log /var/log/nginx/southramp.access.log;
    error_log /var/log/nginx/southramp.error.log;

    client_max_body_size 100M;

    location /static/ {
        alias /home/southramp/django/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /home/southramp/django/mediafiles/;
        expires 1h;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/southramp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/southramp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.southramp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = southramp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name southramp.com www.southramp.com;
    return 404; # managed by Certbot




}
